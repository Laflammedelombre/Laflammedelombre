<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WOD Timer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 500px;
        padding: 25px;
        text-align: center;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .round {
        font-size: 20px;
        opacity: 0.7;
        margin-bottom: 25px;
    }

    .timer {
        font-size: 90px;
        font-weight: bold;
        letter-spacing: 3px;
        margin: 20px 0;
    }

    .exercise {
        font-size: 30px;
        font-weight: bold;
        min-height: 70px;
        margin-bottom: 35px;
    }

    .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
    }

    button {
        border: none;
        border-radius: 15px;
        padding: 18px 25px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    #start {
        background: #35c759;
        color: white;
    }

    #pause {
        background: #ff9f0a;
        color: white;
    }

    #restart {
        background: #ff3b30;
        color: white;
    }

    button:active {
        transform: scale(0.96);
    }

    .progress {
        margin-top: 35px;
        height: 10px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: #35c759;
        transition: width 0.2s linear;
    }

    .status {
        margin-top: 15px;
        opacity: 0.6;
        font-size: 16px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🔥 WOD EMOM</h1>

    <div class="round" id="round">
        Tour 1 / 4
    </div>

    <div class="timer" id="timer">
        20:00
    </div>

    <div class="exercise" id="exercise">
        Prêt ?
    </div>

    <div class="buttons">
        <button id="start">▶️ Start</button>
        <button id="pause">⏸️ Pause</button>
        <button id="restart">🔄 Restart</button>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="status">
        Appuie sur Start pour commencer
    </div>

</div>


<script>

/* =========================================
   CONFIGURATION DU WOD
========================================= */

const workout = [
    {
        name: "12 squats",
        speech: "12 squats"
    },
    {
        name: "10 pompes",
        speech: "10 pompes"
    },
    {
        name: "12 fentes arrière",
        speech: "12 fentes arrière"
    },
    {
        name: "12 sit-ups",
        speech: "12 sit-ups"
    },
    {
        name: "Minute de repos",
        speech: "Minute de repos"
    }
];

const TOTAL_MINUTES = 20;
const TOTAL_SECONDS = TOTAL_MINUTES * 60;


/* =========================================
   VARIABLES
========================================= */

let elapsed = 0;
let timerInterval = null;
let running = false;
let lastSecond = -1;

let audioContext = null;


/* =========================================
   ELEMENTS HTML
========================================= */

const timerDisplay = document.getElementById("timer");
const exerciseDisplay = document.getElementById("exercise");
const roundDisplay = document.getElementById("round");
const statusDisplay = document.getElementById("status");
const progressBar = document.getElementById("progressBar");

const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");
const restartButton = document.getElementById("restart");


/* =========================================
   SON
========================================= */

function initAudio() {

    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


function beep(frequency = 800, duration = 150) {

    initAudio();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = frequency;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(0.3, audioContext.currentTime);

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration / 1000
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration / 1000
    );
}


/* =========================================
   VOIX
========================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "fr-FR";
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    window.speechSynthesis.speak(utterance);
}


/* =========================================
   AFFICHAGE DU TIMER
========================================= */

function updateDisplay() {

    const remaining = TOTAL_SECONDS - elapsed;

    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    timerDisplay.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");


    /* Progression */

    const progress =
        (elapsed / TOTAL_SECONDS) * 100;

    progressBar.style.width = progress + "%";


    /* Exercice actuel */

    const minute = Math.floor(elapsed / 60);

    const exerciseIndex = minute % workout.length;

    exerciseDisplay.textContent =
        workout[exerciseIndex].name;


    /* Tour */

    const round =
        Math.floor(minute / workout.length) + 1;

    roundDisplay.textContent =
        "Tour " + Math.min(round, 4) + " / 4";


    /* Statut */

    if (running) {
        statusDisplay.textContent =
            "En cours 🔥";
    }
}


/* =========================================
   ANNOUNCES
========================================= */

function handleAnnouncements() {

    const secondsInMinute = elapsed % 60;

    /*
       15 secondes avant le changement
       Exemple :
       00:45 → annonce
    */

    if (secondsInMinute === 45) {

        beep(600, 200);

        setTimeout(() => {
            speak("Changement dans 15 secondes");
        }, 100);
    }


    /*
       Début d'une nouvelle minute
    */

    if (
        secondsInMinute === 0 &&
        elapsed > 0
    ) {

        const minute = Math.floor(elapsed / 60);

        const exerciseIndex =
            minute % workout.length;

        beep(1000, 250);

        setTimeout(() => {

            speak(
                workout[exerciseIndex].speech
            );

        }, 200);
    }


    /*
       Début du WOD
    */

    if (elapsed === 0) {

        beep(1000, 250);

        setTimeout(() => {

            speak("12 squats");

        }, 200);
    }


    /*
       3 secondes avant la fin
    */

    if (elapsed === TOTAL_SECONDS - 3) {

        beep(1200, 100);
    }


    /*
       FIN
    */

    if (elapsed === TOTAL_SECONDS) {

        beep(1200, 400);

        setTimeout(() => {

            speak("WOD terminé ! Bravo !");

        }, 300);

        exerciseDisplay.textContent =
            "🔥 WOD TERMINÉ !";

        statusDisplay.textContent =
            "Bravo 💪";

        running = false;

        clearInterval(timerInterval);

        timerInterval = null;
    }
}


/* =========================================
   TICK
========================================= */

function tick() {

    if (!running) {
        return;
    }

    updateDisplay();

    handleAnnouncements();

    elapsed++;

    if (elapsed > TOTAL_SECONDS) {
        elapsed = TOTAL_SECONDS;
    }
}


/* =========================================
   START
========================================= */

startButton.addEventListener("click", () => {

    initAudio();

    if (running) {
        return;
    }

    /*
       Si on était à la fin,
       on repart automatiquement à 0
    */

    if (elapsed >= TOTAL_SECONDS) {
        elapsed = 0;
    }

    running = true;

    statusDisplay.textContent =
        "En cours 🔥";

    /*
       Annonce immédiate au démarrage
    */

    if (elapsed === 0) {

        beep(1000, 250);

        setTimeout(() => {
            speak("12 squats");
        }, 200);
    }

    updateDisplay();

    timerInterval = setInterval(
        tick,
        1000
    );
});


/* =========================================
   PAUSE
========================================= */

pauseButton.addEventListener("click", () => {

    running = false;

    clearInterval(timerInterval);

    timerInterval = null;

    statusDisplay.textContent =
        "En pause ⏸️";

    window.speechSynthesis.cancel();
});


/* =========================================
   RESTART
========================================= */

restartButton.addEventListener("click", () => {

    running = false;

    clearInterval(timerInterval);

    timerInterval = null;

    elapsed = 0;

    window.speechSynthesis.cancel();

    updateDisplay();

    timerDisplay.textContent = "20:00";

    exerciseDisplay.textContent =
        "Prêt ?";

    roundDisplay.textContent =
        "Tour 1 / 4";

    progressBar.style.width = "0%";

    statusDisplay.textContent =
        "Appuie sur Start pour commencer";

    beep(500, 100);
});


/* =========================================
   INITIALISATION
========================================= */

updateDisplay();

</script>

</body>
</html>
